name: Fetch

on:
  workflow_dispatch:
  schedule:
    # 表达式生成 https://crontab.guru/
    - cron: '30 */12 * * *'
  push:
    paths:
      - 'sources.list'
      - 'config.yml'
      - 'abpwhite.txt'
      - '.github/workflows/**'
      - '**.py'
      - 'snippets/_*'
      - 'gen_status.py'

concurrency:
  group: fetch-serial
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: 迁出代码
      uses: actions/checkout@v4
    - name: 设置时区
      run: sudo timedatectl set-timezone 'Asia/Shanghai'
    - name: 安装 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
        cache: 'pip'
    - name: 安装依赖
      run: pip install -r requirements.txt
    - name: 下载 mihomo 内核与地理数据（用于云端真实测速）
      run: |
        mkdir -p mihomo_data
        BIN_URL=$(curl -sL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | grep -Eo 'https://[^"]*mihomo-linux-amd64-v[^"]*\.gz' | head -n1)
        echo "mihomo: $BIN_URL"
        curl -sL "$BIN_URL" -o mihomo.gz && gunzip -f mihomo.gz && chmod +x mihomo
        curl -sL "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat" -o mihomo_data/geoip.dat
        curl -sL "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat" -o mihomo_data/geosite.dat
        curl -sL "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb" -o mihomo_data/country.mmdb
        ls -la mihomo mihomo_data/
    - name: 执行任务
      env:
        MIHOMO_BIN: ${{ github.workspace }}/mihomo
        MIHOMO_DATA: ${{ github.workspace }}/mihomo_data
      run: python ./fetch.py

    - name: 真实代理测活并过滤订阅
      env:
        MIHOMO_BIN: ${{ github.workspace }}/mihomo
        # 多端点交叉验证（严格模式：全端点必须通过）：
        #   cloudflare/gstatic/msft = 海外可达性
        #   miui generate_204 = 中国回连验证：节点能从海外访问中国端点，
        #     说明没被 GFW 双向阻断，对中国用户更可能可用
        ALIVE_TEST_URLS: "http://cp.cloudflare.com/generate_204,http://www.gstatic.com/generate_204,http://connect.rom.miui.com/generate_204"
        ALIVE_TIMEOUT_MS: '3500'
        # 延迟上限：加了 miui 中国端点后，部分节点到中国延迟偏高，
        # 放宽到 2000ms 避免误杀可用节点（严格模式已保证全端点必须通过）
        ALIVE_MAX_DELAY_MS: '2000'
        ALIVE_WORKERS: '128'
        ALIVE_RETRY: '1'
        ALIVE_MIN_RATIO: '0.001'
        ALIVE_DROP_TYPES: "http,socks5"
        # 不设节点数量上限：所有云端测活通过的节点全部保留
        # （无需 ALIVE_MAX_KEEP / ALIVE_MAX_PER_SOURCE，默认值 0 = 不限制）
        # 二次过滤：check_alive.py 自动读取 asia_probe_result.json（中国服务器探针结果）
      run: python ./check_alive.py

    - name: 生成面板状态 JSON
      run: python ./gen_status.py

    - name: 生成移动端轻量订阅
      run: python ./gen_mobile.py

    - name: 提交更改
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"
        git add list*
        git add snippets/
        git add web/status.json
        git add alive_result.json
        git commit -m "$(date '+%Y-%m-%d %H:%M:%S') 抓取节点" || echo "无新改动，跳过提交"
    - name: 推送更改
      run: |
        # 并发推送冲突时 rebase 远程最新提交并重试，最多 3 次
        git push origin master && exit 0 || true
        for i in 1 2 3; do
          echo "推送被拒，rebase 重试 $i/3"
          git pull --rebase origin master || git rebase --abort || true
          git push origin master && exit 0 || true
          sleep 5
        done
        exit 1

    - name: 计算要清除缓存的文件
      id: purge_urls
      run: |
        sleep 5
        baseUrl="https://cdn.jsdelivr.net/gh/${{ github.repository }}@master"
        urls=""
        for f in `find snippets -name "*.yml" -type f`; do
          urls+="${baseUrl}/${f},"
        done
        for f in `find . -name "list*" -type f -maxdepth 1`; do
          urls+="${baseUrl}/${f},"
        done
        echo "urls=${urls%,*}" >> $GITHUB_OUTPUT
    - name: 清除 JsDelivr CDN 缓存
      uses: egad13/purge-jsdelivr-cache@v1
      with:
        url: ${{ steps.purge_urls.outputs.urls }}
      continue-on-error: true
